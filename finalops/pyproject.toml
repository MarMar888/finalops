[project]
name = "finalops"
version = "0.1.0"
description = "AI-native scaffolding for operations-research agents: a requirement ledger, constraint traceability, and a one-call solve/validate/gate loop on top of PuLP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
finalops = "finalops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finalops"]

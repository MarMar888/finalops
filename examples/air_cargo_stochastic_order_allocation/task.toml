schema_version = "1.1"
artifacts = ["/app/submissions"]

[task]
name = "oragentbench/air_cargo_stochastic_order_allocation"
description = "Air Cargo Stochastic Order Allocation"
keywords = ["operations-research", "optimization", "pyscipopt", "scip", "benchmark"]

[metadata]
benchmark = "ORAgentBench"
source_public_env = "source/agent_envs/air_cargo_stochastic_order_allocation"
source_hidden_eval = "source/evals/air_cargo_stochastic_order_allocation/scripts/evaluate_solution.py"
base_image = "oragentbench-base:py311-scip"
requires_gurobi = false
solution_artifacts = ["submissions/model.md", "submissions/solve.py", "submissions/solve_log.md", "submissions/solution.csv or submissions/solution.json"]

[agent]
timeout_sec = 2700

[verifier]
timeout_sec = 360.0
user = "root"

[solution]
env = { ORCLAW_SOLVE_TIME_LIMIT_SECONDS = "300", ORCLAW_SCIP_GAP = "0.0005" }

[environment]
skills_dir = "/skills"
build_timeout_sec = 600.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
allow_internet = true
